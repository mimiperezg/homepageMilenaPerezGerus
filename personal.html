<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Milena Perez-Gerus" />
    <meta
      name="description"
      content="Personal interests of Milena Perez-Gerus in photography."
    />
    <title>Milena Perez-Gerus Personal Interests</title>

    <link rel="icon" href="images/favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-top d-flex justify-content-between">
        <h1 class="site-name">
          <a href="index.html">Milena Perez-Gerus</a>
        </h1>
        <p class="site-clock"></p>
      </div>
      <nav class="site-nav">
        <ul class="list-unstyled d-flex gap-3 m-0">
          <li><a href="index.html">about</a></li>
          <li><a href="projects.html">projects</a></li>
          <li><a href="personal.html" aria-current="page">personal</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="container gallery-main">
      <section class="section photography">
        <h2 class="section-title">Photos</h2>
        <div class="gallery row g-3">
          <div class="col-md-6">
            <button type="button" class="gallery-button">
              <img
                src="images/personal/photography/denmark_house.jpg"
                class="img-fluid"
                alt="House in Denmark"
              />
              <span class="photo-caption" hidden>
                <span class="photo-date">2024-06-01</span>
                <span class="photo-notes"
                  >Liselund in Denmark. 18th century manor house.</span
                >
              </span>
            </button>
          </div>
          <div class="col-md-6">
            <button type="button" class="gallery-button">
              <img
                src="images/personal/photography/denmark_house2.jpg"
                class="img-fluid"
                alt="The house from afar in Denmark"
              />
              <span class="photo-caption" hidden>
                <span class="photo-date">2024-06-01</span>
                <span class="photo-notes"
                  >The romantic garden of Liselund in Denmark.</span
                >
              </span>
            </button>
          </div>
          <div class="col-md-6">
            <button type="button" class="gallery-button">
              <img
                src="images/personal/photography/denmark_woods.jpg"
                class="img-fluid"
                alt="Forest in Denmark"
              />
              <span class="photo-caption" hidden>
                <span class="photo-date">2024-06-01</span>
                <span class="photo-notes"
                  >Solo hike through the woods of Møns Klint.</span
                >
              </span>
            </button>
          </div>
          <div class="col-md-6">
            <button type="button" class="gallery-button">
              <img
                src="images/personal/photography/denmark_ocean.jpg"
                class="img-fluid"
                alt="Ocean in Denmark"
              />
              <span class="photo-caption" hidden>
                <span class="photo-date">2024-06-01</span>
                <span class="photo-notes"
                  >The Baltic Sea off the limestone cliffs of Møns Klint.</span
                >
              </span>
            </button>
          </div>
        </div>
      </section>

      <footer class="site-footer">
        <p>&copy; 2026 Milena Perez-Gerus</p>
      </footer>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
